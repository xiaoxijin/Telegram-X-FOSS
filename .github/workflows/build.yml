name: Build

on:
  workflow_dispatch:
    branches:
        - '**'
    inputs:
      extension:
        description: 'Extension variant (none / unifiedpush) — D1'
        required: false
        default: 'none'
      custom_node_link:
        description: 'Built-in proxy node link (vless://...) — A1/A2/A5/A6'
        required: false
        default: ''
      custom_default_language:
        description: 'Default language pack id (e.g. zh-hans) — B2/B3'
        required: false
        default: ''
      custom_pro_link:
        description: 'TG PRO membership link — C2'
        required: false
        default: ''
      custom_ntfy_link:
        description: 'ntfy install page link — D2'
        required: false
        default: ''
      fast:
        description: 'Only build clang Latest (device-testing builds)'
        type: boolean
        required: false
        default: false
  push:
    branches:
        - '**'

permissions: write-all

jobs:
  build:
    name: Build (${{ matrix.target }}, ${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['gcc', 'clang']
        variant:
          - name: Latest
            task: 'assembleLatestRelease'
            args: ''
          - name: Lollipop
            task: 'assembleLollipopRelease'
            args: ''
          - name: Marshmallow
            task: 'assembleMarshmallowRelease'
            args: ''
          - name: LegacyArm32
            task: 'assembleLegacyRelease'
            args: '-PuseLegacyNdk=true'
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
      - name: Remove prebuilt binaries 
        run: |
            find . -type f '(' -name '*.a' -o -name '*.so' -o -name '*.o' ')' -delete
      - name: Free up some space
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        run: |
          curl 'https://raw.githubusercontent.com/AmanoTeam/gha-free-space/refs/heads/master/main.sh' -sSf | bash
      - name: Set swap space
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20
      - uses: actions/setup-java@main
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Install required dependencies
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        run: |
          sudo apt-get update
          sudo apt-get -o Dir::Log::History=/dev/null -o Dir::Log::Terminal=/dev/null install gperf build-essential cmake libssl-dev zlib1g-dev automake libtool rustup
      - name: Install Android SDK
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        run: |
          wget 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' -O '/tmp/commandlinetools.zip'
          sudo mkdir --parent "${ANDROID_HOME}"
          sudo chmod 777 "${ANDROID_HOME}"
          unzip -d "${ANDROID_HOME}" '/tmp/commandlinetools.zip'
          yes | "${ANDROID_HOME}/cmdline-tools/bin/sdkmanager" --licenses --sdk_root="${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/bin/sdkmanager" --install 'ndk;23.2.8568313' 'ndk;30.0.16248370' --sdk_root="${ANDROID_HOME}"
      - name: Install android-gcc-cross
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        if: matrix.target == 'gcc'
        run: |
          declare -r PINO_TARBALL='/tmp/gcc.tar.xz'
          declare -r PINO_URL='https://github.com/AmanoTeam/android-gcc-cross/releases/latest/download/x86_64-unknown-linux-gnu.tar.xz'
          
          curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${PINO_URL}" --output "${PINO_TARBALL}"
          tar --directory="$(dirname "${PINO_TARBALL}")" --extract --file="${PINO_TARBALL}"
                  
          echo 'PINO_STATIC=true' >> "${GITHUB_ENV}"
          echo 'PINO_NEON=true' >> "${GITHUB_ENV}"
          echo 'PINO_OPT_LEVEL=2' >> "${GITHUB_ENV}"
          echo 'PINO_HOME=/tmp/android-gcc-cross' >> "${GITHUB_ENV}"

          /tmp/android-gcc-cross/bin/ndk-patch
      - name: Update gcc-wrapper
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        if: matrix.target == 'gcc'
        run: |
          "${PINO_HOME}/bin/update-wrapper"
      - name: Build
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        run: |
          ./scripts/setup.sh --skip-sdk-setup
          ./scripts/setup-rust.sh
          # distribution configuration under test (PORTING_FEATURES.md §4); empty = feature off
          cat >> local.properties << EOF
          tgx.extension=${{ github.event_name == 'workflow_dispatch' && inputs.extension || 'none' }}
          custom.node_link=${{ github.event_name == 'workflow_dispatch' && inputs.custom_node_link || '' }}
          custom.default_language=${{ github.event_name == 'workflow_dispatch' && inputs.custom_default_language || '' }}
          custom.pro_link=${{ github.event_name == 'workflow_dispatch' && inputs.custom_pro_link || '' }}
          custom.ntfy_link=${{ github.event_name == 'workflow_dispatch' && inputs.custom_ntfy_link || '' }}
          EOF
          ./gradlew "${{ matrix.variant.task }}" ${{ matrix.variant.args }} -Pabi=all
      - name: Sign APKs
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        run: |
          declare -r APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)"
          declare -r KEYSTORE_FILE="${GITHUB_WORKSPACE}/scripts/testkey.p12"

          for apk in app/build/outputs/apk/*/release/*.apk; do
            "${APKSIGNER}" sign --ks "${KEYSTORE_FILE}" --ks-pass pass:123456 --ks-key-alias testkey --key-pass pass:123456 "${apk}"
            "${APKSIGNER}" verify "${apk}"
          done
      - name: Create logs
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        if: always()
        run: |
          tar --create --file=- '/var/tmp/obggcc' | xz --threads='0' --compress -9 > '/tmp/logs.tar.xz'
      - name: Upload logs
        if: always() && (github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest'))
        uses: actions/upload-artifact@main
        with:
          name: logs-${{ matrix.target }}-${{ matrix.variant.name }}
          if-no-files-found: error
          path: |
              /tmp/logs.tar.xz
      - name: Upload artifact
        if: github.event_name == 'push' || inputs.fast != true || (matrix.target == 'clang' && matrix.variant.name == 'Latest')
        uses: actions/upload-artifact@main
        with:
          name: build-${{ matrix.target }}-${{ matrix.variant.name }}
          path: app/build/outputs/apk/*/release/*.apk

